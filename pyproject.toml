[project]
name = "agent-evolve"
version = "0.1.0"
description = "Universal Agent Evolution Protocol: mine user preferences from conversations, propose, approve, apply — for any agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "universal-evolution contributors" }]
keywords = ["agent", "memory", "learning", "preferences", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
evolve = "evolve.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["evolve"]
