<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- header -->
  <text x="800" y="88" text-anchor="middle" font-size="62" font-weight="800" fill="#1f2430">agent-evolve</text>
  <text x="800" y="136" text-anchor="middle" font-size="25" letter-spacing="3" fill="#6b7280">UNIVERSAL AGENT EVOLUTION PROTOCOL</text>
  <rect x="690" y="158" width="220" height="4" rx="2" fill="url(#brand)"/>

  <!-- row 1: scan -> aggregate -> propose -->
  <g>
    <rect x="120" y="230" width="280" height="130" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <circle cx="156" cy="266" r="14" fill="#2563eb"/>
    <text x="156" y="271" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">1</text>
    <text x="192" y="272" font-size="23" font-weight="700" fill="#1f2430">扫描 scan</text>
    <text x="150" y="310" font-size="16" fill="#6b7280">提取对话中的偏好信号</text>
    <text x="150" y="334" font-size="16" fill="#6b7280">纠错 / 重复 / 明确命令</text>
  </g>
  <line x1="404" y1="295" x2="434" y2="295" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

  <g>
    <rect x="440" y="230" width="280" height="130" rx="18" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
    <circle cx="476" cy="266" r="14" fill="#4f46e5"/>
    <text x="476" y="271" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">2</text>
    <text x="512" y="272" font-size="23" font-weight="700" fill="#1f2430">统计 aggregate</text>
    <text x="470" y="310" font-size="16" fill="#6b7280">频率 × 信号权重 × 时间衰减</text>
    <text x="470" y="334" font-size="16" fill="#6b7280">score 排序，过滤噪音</text>
  </g>
  <line x1="724" y1="295" x2="754" y2="295" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

  <g>
    <rect x="760" y="230" width="280" height="130" rx="18" fill="#ffffff" stroke="#ddd6fe" stroke-width="2"/>
    <circle cx="796" cy="266" r="14" fill="#7c3aed"/>
    <text x="796" y="271" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">3</text>
    <text x="832" y="272" font-size="23" font-weight="700" fill="#1f2430">提案 propose</text>
    <text x="790" y="310" font-size="16" fill="#6b7280">过阈值 + 去重</text>
    <text x="790" y="334" font-size="16" fill="#6b7280">附完整证据链</text>
  </g>
  <!-- curve propose -> approve -->
  <path d="M 900 364 C 900 420, 470 420, 470 448" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="700" y="408" text-anchor="middle" font-size="15" fill="#94a3b8">人类确认</text>

  <!-- row 2: approve -> apply -> rollback -->
  <g>
    <rect x="330" y="452" width="280" height="130" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="2.5"/>
    <circle cx="366" cy="488" r="14" fill="#16a34a"/>
    <text x="366" y="493" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">✓</text>
    <text x="402" y="494" font-size="23" font-weight="700" fill="#15803d">人工审批 approve</text>
    <text x="360" y="532" font-size="16" fill="#4b5563">只有人类动作算批准</text>
    <text x="360" y="556" font-size="16" fill="#4b5563">写入审计台账</text>
  </g>
  <line x1="614" y1="517" x2="644" y2="517" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

  <g>
    <rect x="650" y="452" width="280" height="130" rx="18" fill="#fffbeb" stroke="#fde68a" stroke-width="2"/>
    <circle cx="686" cy="488" r="14" fill="#d97706"/>
    <text x="686" y="493" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">4</text>
    <text x="722" y="494" font-size="23" font-weight="700" fill="#1f2430">应用 apply</text>
    <text x="680" y="532" font-size="16" fill="#6b7280">自动备份原文件</text>
    <text x="680" y="556" font-size="16" fill="#6b7280">合并进受保护记忆</text>
  </g>
  <line x1="934" y1="517" x2="964" y2="517" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

  <g>
    <rect x="970" y="452" width="280" height="130" rx="18" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
    <circle cx="1006" cy="488" r="14" fill="#dc2626"/>
    <text x="1006" y="493" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">↩</text>
    <text x="1042" y="494" font-size="23" font-weight="700" fill="#1f2430">回滚 rollback</text>
    <text x="1000" y="532" font-size="16" fill="#6b7280">按台账恢复上一版</text>
    <text x="1000" y="556" font-size="16" fill="#6b7280">全程可审计</text>
  </g>

  <!-- features -->
  <g>
    <rect x="120" y="628" width="420" height="140" rx="16" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <text x="148" y="672" font-size="20" font-weight="700" fill="#2563eb">零第三方依赖</text>
    <text x="148" y="706" font-size="16" fill="#6b7280">纯 Python 标准库</text>
    <text x="148" y="730" font-size="16" fill="#6b7280">任何环境直接运行</text>
  </g>
  <g>
    <rect x="590" y="628" width="420" height="140" rx="16" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <text x="618" y="672" font-size="20" font-weight="700" fill="#16a34a">人类审批 · 可审计</text>
    <text x="618" y="706" font-size="16" fill="#6b7280">提案制 + 追加式台账</text>
    <text x="618" y="730" font-size="16" fill="#6b7280">发现自动，写入必批准</text>
  </g>
  <g>
    <rect x="1060" y="628" width="420" height="140" rx="16" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <text x="1088" y="672" font-size="20" font-weight="700" fill="#7c3aed">任何智能体可挂载</text>
    <text x="1088" y="706" font-size="16" fill="#6b7280">Claude · Codex · DSh</text>
    <text x="1088" y="730" font-size="16" fill="#6b7280">OpenClaw · 自研 Agent</text>
  </g>

  <!-- signal weights -->
  <g>
    <rect x="90" y="806" width="340" height="52" rx="26" fill="#fee2e2"/>
    <text x="260" y="838" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">correction 1.0 · 用户纠正</text>
  </g>
  <g>
    <rect x="450" y="806" width="340" height="52" rx="26" fill="#fee2e2"/>
    <text x="620" y="838" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">explicit 1.0 · 明确记住</text>
  </g>
  <g>
    <rect x="810" y="806" width="340" height="52" rx="26" fill="#fef3c7"/>
    <text x="980" y="838" text-anchor="middle" font-size="16" font-weight="700" fill="#d97706">repeat 0.7 · 跨会话重复</text>
  </g>
  <g>
    <rect x="1170" y="806" width="340" height="52" rx="26" fill="#dbeafe"/>
    <text x="1340" y="838" text-anchor="middle" font-size="16" font-weight="700" fill="#2563eb">acceptance 0.3 · 零纠正</text>
  </g>
</svg>
